<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Tools</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <h1>Web Tools</h1>
          <p class="brand-copy">小さな業務ツールをまとめて使えるシンプルな置き場です。</p>
        </div>
        <label class="mobile-nav" for="tool-select">
          <span>ツール選択</span>
          <select id="tool-select" class="tool-select">
            <option value="network">接続情報</option>
            <option value="markdown">Excel→MarkDown</option>
            <option value="base64">Base64変換</option>
            <option value="clipboard">コピペ帳</option>
            <option value="talk">つぶやき</option>
          </select>
        </label>
        <nav class="tool-nav" aria-label="ツールメニュー">
          <button class="nav-link" data-route="network">接続情報</button>
          <button class="nav-link is-active" data-route="markdown">Excel→MarkDown</button>
          <button class="nav-link" data-route="base64">Base64変換</button>
          <button class="nav-link" data-route="clipboard">コピペ帳</button>
          <button class="nav-link" data-route="talk">つぶやき</button>
        </nav>
        <nav class="external-nav" aria-label="関連リンク">
          <p class="external-nav-title">関連リンク</p>
          <a class="external-link" href="https://nekotype.github.io/AfterImage">フラッシュ画像記憶</a>
          <a class="external-link" href="https://nekotype.github.io/MentalMath">フラッシュ暗算</a>
        </nav>
        <div class="sidebar-footer">
          <p id="app-version" class="version-value">Ver 1.3.5</p>
        </div>
      </aside>

      <main class="content">
        <section class="hero">
          <h2 id="page-title">Excel→MarkDown</h2>
          <p id="page-description">
            Excel から貼り付けた表を Markdown のテーブルへ変換します。GitHub やメモ用にそのままコピーできます。
          </p>
        </section>

        <section id="tool-root" class="tool-root" aria-live="polite"></section>
      </main>
    </div>

    <template id="markdown-template">
      <div class="panel">
        <label class="field block-field" for="excel-input">
          <span>Excel から貼り付け</span>
          <textarea
            id="excel-input"
            rows="12"
            placeholder="Excel から表をそのまま貼り付けてください"
          ></textarea>
        </label>

        <div class="form-row">
          <button id="convert-markdown" class="primary-button" type="button">Markdown に変換</button>
          <button id="copy-markdown" class="secondary-button" type="button" disabled>
            Markdown をコピー
          </button>
        </div>

        <div id="markdown-status" class="status-box">表を貼り付けて変換してください。</div>

        <label class="field block-field" for="markdown-output">
          <span>Markdown 出力</span>
          <textarea id="markdown-output" rows="12" readonly></textarea>
        </label>
      </div>
    </template>

    <template id="network-template">
      <div class="panel">
        <div class="form-row">
          <button id="refresh-network-info" class="primary-button" type="button">情報を更新</button>
          <button id="copy-network-info" class="secondary-button" type="button" disabled>
            結果をコピー
          </button>
        </div>

        <div class="hint-list">
          <p>グローバルIPと地域情報は外部APIから取得します。</p>
          <p>地域は推定値なので、VPN やプロキシ利用時は実際の場所と異なることがあります。</p>
        </div>

        <div id="network-status" class="status-box">情報を取得してください。</div>

        <div class="table-wrap">
          <table class="result-table">
            <thead>
              <tr>
                <th>項目</th>
                <th>値</th>
              </tr>
            </thead>
            <tbody id="network-results"></tbody>
          </table>
        </div>

        <label class="field block-field" for="network-export">
          <span>コピー用テキスト</span>
          <textarea id="network-export" rows="10" readonly placeholder="取得後にここへ結果が入ります"></textarea>
        </label>
      </div>
    </template>

    <template id="talk-template">
      <div class="panel talk-panel">
        <div class="talk-toolbar">
          <div id="talk-status" class="status-box">ひとりつぶやきを残せます。</div>
          <button id="clear-talk-messages" class="secondary-button" type="button">全クリア</button>
        </div>

        <div id="talk-empty" class="talk-empty">まだメッセージはありません。最初のつぶやきを残してください。</div>
        <div id="talk-list" class="talk-list" aria-live="polite"></div>

        <div class="talk-compose">
          <label class="field block-field" for="talk-input">
            <span>つぶやき</span>
            <textarea
              id="talk-input"
              rows="4"
              placeholder="今のメモや独り言を残せます。Enterで送信、Shift+Enterで改行。"
            ></textarea>
          </label>
          <div class="talk-compose-actions">
            <button id="send-talk-message" class="primary-button" type="button">送信</button>
          </div>
        </div>
      </div>
    </template>

    <template id="base64-template">
      <div class="panel">
        <div class="hint-list">
          <p>UTF-8の文字列を Base64 へ変換、または Base64 から元の文字列へ復元します。</p>
          <p>日本語や改行を含むテキストにも対応します。</p>
        </div>

        <div class="form-row">
          <button id="encode-base64" class="primary-button" type="button">エンコード</button>
          <button id="decode-base64" class="secondary-button" type="button">デコード</button>
          <button id="copy-base64-output" class="secondary-button" type="button" disabled>
            結果をコピー
          </button>
        </div>

        <div id="base64-status" class="status-box">文字列または Base64 を入力してください。</div>

        <label class="field block-field" for="base64-input">
          <span>入力</span>
          <textarea
            id="base64-input"
            rows="8"
            placeholder="ここに変換したい文字列、または Base64 を入力してください"
          ></textarea>
        </label>

        <label class="field block-field" for="base64-output">
          <span>出力</span>
          <textarea id="base64-output" rows="8" readonly placeholder="変換結果がここに表示されます"></textarea>
        </label>
      </div>
    </template>

    <template id="clipboard-template">
      <div class="panel clipboard-panel">
        <div class="talk-toolbar">
          <div id="clipboard-status" class="status-box">
            よく使う文字列を保存して、一覧からワンクリックでコピーできます。
          </div>
          <button id="clear-clipboard-items" class="secondary-button" type="button">全クリア</button>
        </div>

        <div class="talk-compose">
          <label class="field block-field" for="clipboard-input">
            <span>保存する文字列</span>
            <textarea
              id="clipboard-input"
              rows="4"
              placeholder="住所、定型文、メール文面などを保存できます"
            ></textarea>
          </label>
          <div class="talk-compose-actions">
            <button id="save-clipboard-item" class="primary-button" type="button">保存</button>
          </div>
        </div>

        <div id="clipboard-empty" class="talk-empty">
          まだ保存された文字列はありません。上から追加してください。
        </div>
        <div id="clipboard-list" class="clipboard-list" aria-live="polite"></div>
      </div>
    </template>

    <script type="module" src="./app.js"></script>
  </body>
</html>
